<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Stats Counter - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }
        h1 { text-align: center; margin-bottom: 1rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { text-align: center; color: #d4a5af; margin-bottom: 2rem; }
        textarea {
            width: 100%;
            height: 250px;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(200, 100, 150, 0.4);
            border-radius: 10px;
            color: #f5e6e8;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 2rem;
        }
        textarea:focus { outline: none; border-color: rgba(200, 100, 150, 0.8); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(200, 100, 150, 0.3);
            border-radius: 12px;
            text-align: center;
        }
        .stat-label { color: #d4a5af; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .stat-value { font-size: 2.5rem; font-weight: bold; color: #ff6b9d; }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>📊 Text Stats Counter</h1>
        <p class="subtitle">Analyze your text and get detailed statistics</p>
        
        <textarea id="textInput" placeholder="Paste or type your text here..." oninput="updateStats()"></textarea>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Words</div>
                <div class="stat-value" id="wordCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Characters</div>
                <div class="stat-value" id="charCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Characters (no spaces)</div>
                <div class="stat-value" id="charNoSpace">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Sentences</div>
                <div class="stat-value" id="sentenceCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Paragraphs</div>
                <div class="stat-value" id="paraCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Words/Sentence</div>
                <div class="stat-value" id="avgWords">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Reading Time (min)</div>
                <div class="stat-value" id="readTime">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Longest Word (chars)</div>
                <div class="stat-value" id="longWord">0</div>
            </div>
        </div>
    </div>

    <script>
        function updateStats() {
            const text = document.getElementById('textInput').value;

            // Word count
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            const wordCount = words.length;

            // Character counts
            const charCount = text.length;
            const charNoSpace = text.replace(/\s/g, '').length;

            // Sentence count
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            const sentenceCount = sentences.length;

            // Paragraph count
            const paras = text.split(/\n\n+/).filter(p => p.trim().length > 0);
            const paraCount = paras.length;

            // Average words per sentence
            const avgWords = sentenceCount > 0 ? (wordCount / sentenceCount).toFixed(1) : 0;

            // Reading time (assuming 200 words per minute)
            const readTime = Math.ceil(wordCount / 200);

            // Longest word
            const longest = Math.max(...words.map(w => w.length), 0);

            // Update display
            document.getElementById('wordCount').textContent = wordCount;
            document.getElementById('charCount').textContent = charCount;
            document.getElementById('charNoSpace').textContent = charNoSpace;
            document.getElementById('sentenceCount').textContent = sentenceCount;
            document.getElementById('paraCount').textContent = paraCount;
            document.getElementById('avgWords').textContent = avgWords;
            document.getElementById('readTime').textContent = readTime;
            document.getElementById('longWord').textContent = longest;
        }
    </script>
</body>
</html>
