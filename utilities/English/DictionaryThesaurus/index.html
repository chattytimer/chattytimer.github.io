<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary & Thesaurus - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }
        h1 { text-align: center; margin-bottom: 1rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .search-section {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }
        input {
            flex: 1;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
        }
        input:focus { outline: none; border-color: rgba(200, 100, 150, 0.8); }
        button {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .result-section { display: none; }
        .word-heading {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff6b9d;
            margin-bottom: 0.5rem;
        }
        .pronunciation {
            color: #d4a5af;
            font-style: italic;
            margin-bottom: 1.5rem;
        }
        .definition-group { margin-bottom: 1.5rem; }
        .part-of-speech {
            font-size: 1.1rem;
            color: #ff6b9d;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .definition { margin-left: 1rem; margin-bottom: 0.5rem; line-height: 1.6; }
        .definition-label { color: #d4a5af; font-weight: 500; }
        .example { color: #c4a0b0; font-style: italic; margin-left: 1rem; margin-top: 0.3rem; }
        .synonyms {
            padding: 1rem;
            background: rgba(200, 100, 150, 0.1);
            border-left: 3px solid #ff6b9d;
            border-radius: 5px;
            margin-top: 1.5rem;
        }
        .synonym-label { color: #d4a5af; font-weight: bold; }
        .synonym-list { margin-top: 0.5rem; }
        .synonym { display: inline-block; padding: 0.4rem 0.8rem; background: rgba(200, 100, 150, 0.2); border-radius: 5px; margin: 0.3rem; font-size: 0.9rem; }
        .error { color: #ff6b6b; text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>📚 Dictionary & Thesaurus</h1>
        
        <div class="search-section">
            <input type="text" id="wordInput" placeholder="Enter a word..." onkeypress="if(event.key==='Enter') searchWord()">
            <button onclick="searchWord()">Search</button>
        </div>

        <div class="result-section" id="resultSection"></div>
    </div>

    <script>
        // Sample dictionary database
        const dictionary = {
            'serendipity': {
                word: 'serendipity',
                pronunciation: '/ˌser.ən.dɪp.ə.ti/',
                definitions: [
                    {
                        partOfSpeech: 'Noun',
                        definitions: [
                            'The occurrence of events by chance in a happy or beneficial way',
                            'Finding something good without looking for it'
                        ],
                        examples: [
                            'It was pure serendipity that I found this book at the library.',
                            'Our meeting was serendipity; we weren\'t planning to go to that cafe.'
                        ]
                    }
                ],
                synonyms: ['luck', 'chance', 'fortuitousness', 'happenstance', 'coincidence']
            },
            'ephemeral': {
                word: 'ephemeral',
                pronunciation: '/əˈfem.ər.əl/',
                definitions: [
                    {
                        partOfSpeech: 'Adjective',
                        definitions: [
                            'Lasting for a very short time; fleeting',
                            'Temporary; transitory'
                        ],
                        examples: [
                            'Beauty can be ephemeral, lasting only a moment.',
                            'The morning dew was ephemeral, gone by noon.'
                        ]
                    }
                ],
                synonyms: ['fleeting', 'transient', 'temporary', 'short-lived', 'momentary']
            },
            'perspicacious': {
                word: 'perspicacious',
                pronunciation: '/ˌpɜr.spɪˈkeɪ.ʃəs/',
                definitions: [
                    {
                        partOfSpeech: 'Adjective',
                        definitions: [
                            'Having keen insight or discernment',
                            'Able to understand things quickly and clearly'
                        ],
                        examples: [
                            'Her perspicacious analysis revealed the hidden problems.',
                            'The professor made a perspicacious observation about the text.'
                        ]
                    }
                ],
                synonyms: ['insightful', 'perceptive', 'astute', 'shrewd', 'keen']
            },
            'ameliorate': {
                word: 'ameliorate',
                pronunciation: '/əˈmel.i.ə.reɪt/',
                definitions: [
                    {
                        partOfSpeech: 'Verb',
                        definitions: [
                            'To make something better or improve it',
                            'To become better'
                        ],
                        examples: [
                            'The new policies will ameliorate working conditions.',
                            'His mood began to ameliorate after hearing the good news.'
                        ]
                    }
                ],
                synonyms: ['improve', 'enhance', 'better', 'upgrade', 'refine']
            }
        };

        function searchWord() {
            const word = document.getElementById('wordInput').value.toLowerCase().trim();
            const resultSection = document.getElementById('resultSection');

            if (!word) {
                resultSection.style.display = 'none';
                return;
            }

            const entry = dictionary[word];

            if (!entry) {
                resultSection.innerHTML = `<div class="error">Word not found. Try: ${Object.keys(dictionary).join(', ')}</div>`;
                resultSection.style.display = 'block';
                return;
            }

            let html = `
                <div class="word-heading">${entry.word}</div>
                <div class="pronunciation">${entry.pronunciation}</div>
            `;

            entry.definitions.forEach(def => {
                html += `<div class="definition-group">
                    <div class="part-of-speech">${def.partOfSpeech}</div>
                    ${def.definitions.map((d, i) => `
                        <div class="definition">
                            <span class="definition-label">${i + 1}.</span> ${d}
                            ${def.examples && def.examples[i] ? `<div class="example">"${def.examples[i]}"</div>` : ''}
                        </div>
                    `).join('')}
                </div>`;
            });

            html += `<div class="synonyms">
                <div class="synonym-label">Synonyms:</div>
                <div class="synonym-list">
                    ${entry.synonyms.map(s => `<span class="synonym">${s}</span>`).join('')}
                </div>
            </div>`;

            resultSection.innerHTML = html;
            resultSection.style.display = 'block';
        }

        document.getElementById('wordInput').focus();
    </script>
</body>
</html>
