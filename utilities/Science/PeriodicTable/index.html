<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(200, 100, 150, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #d4a5af;
            margin-bottom: 1.5rem;
        }

        .search-box {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
        }

        .search-box input {
            flex: 1;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
            font-size: 1rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: rgba(200, 100, 150, 0.8);
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .element {
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border: 2px solid rgba(200, 100, 150, 0.3);
            background: rgba(0, 0, 0, 0.2);
        }

        .element:hover {
            transform: translateY(-5px);
            border-color: rgba(200, 100, 150, 0.8);
            box-shadow: 0 5px 15px rgba(200, 100, 150, 0.3);
        }

        .element-number {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .element-symbol {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff6b9d;
            margin: 0.3rem 0;
        }

        .element-name {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .element-mass {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 0.2rem;
        }

        /* Category colors */
        .nonmetal { background: rgba(100, 150, 200, 0.2); border-color: rgba(100, 150, 200, 0.5); }
        .metal { background: rgba(200, 150, 100, 0.2); border-color: rgba(200, 150, 100, 0.5); }
        .alkali { background: rgba(100, 200, 100, 0.2); border-color: rgba(100, 200, 100, 0.5); }
        .halogen { background: rgba(200, 200, 100, 0.2); border-color: rgba(200, 200, 100, 0.5); }
        .noble { background: rgba(200, 100, 200, 0.2); border-color: rgba(200, 100, 200, 0.5); }
        .transition { background: rgba(200, 100, 100, 0.2); border-color: rgba(200, 100, 100, 0.5); }

        .element-info {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(200, 100, 150, 0.2);
        }

        .info-title {
            font-size: 1.5rem;
            color: #ff6b9d;
            margin-bottom: 1rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .info-item {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(200, 100, 150, 0.2);
        }

        .info-label {
            font-size: 0.9rem;
            color: #d4a5af;
            margin-bottom: 0.5rem;
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff6b9d;
        }

        .legend {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    
    <div class="container">
        <h1>Periodic Table of Elements</h1>
        <p class="subtitle">Click on any element to view detailed information</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search element by name, symbol, or number..." oninput="filterElements()">
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color nonmetal"></div>
                <span>Nonmetal</span>
            </div>
            <div class="legend-item">
                <div class="legend-color alkali"></div>
                <span>Alkali Metal</span>
            </div>
            <div class="legend-item">
                <div class="legend-color metal"></div>
                <span>Transition Metal</span>
            </div>
            <div class="legend-item">
                <div class="legend-color halogen"></div>
                <span>Halogen</span>
            </div>
            <div class="legend-item">
                <div class="legend-color noble"></div>
                <span>Noble Gas</span>
            </div>
        </div>

        <div class="periodic-table" id="periodicTable"></div>

        <div class="element-info" id="elementInfo" style="display: none;">
            <div class="info-title" id="infoTitle"></div>
            <div class="info-grid" id="infoGrid"></div>
        </div>
    </div>

    <script>
        const elements = [
            {number: 1, symbol: 'H', name: 'Hydrogen', mass: 1.008, category: 'nonmetal'},
            {number: 2, symbol: 'He', name: 'Helium', mass: 4.003, category: 'noble'},
            {number: 3, symbol: 'Li', name: 'Lithium', mass: 6.941, category: 'alkali'},
            {number: 4, symbol: 'Be', name: 'Beryllium', mass: 9.012, category: 'metal'},
            {number: 5, symbol: 'B', name: 'Boron', mass: 10.811, category: 'nonmetal'},
            {number: 6, symbol: 'C', name: 'Carbon', mass: 12.011, category: 'nonmetal'},
            {number: 7, symbol: 'N', name: 'Nitrogen', mass: 14.007, category: 'nonmetal'},
            {number: 8, symbol: 'O', name: 'Oxygen', mass: 15.999, category: 'nonmetal'},
            {number: 9, symbol: 'F', name: 'Fluorine', mass: 18.998, category: 'halogen'},
            {number: 10, symbol: 'Ne', name: 'Neon', mass: 20.180, category: 'noble'},
            {number: 11, symbol: 'Na', name: 'Sodium', mass: 22.990, category: 'alkali'},
            {number: 12, symbol: 'Mg', name: 'Magnesium', mass: 24.305, category: 'metal'},
            {number: 13, symbol: 'Al', name: 'Aluminum', mass: 26.982, category: 'metal'},
            {number: 14, symbol: 'Si', name: 'Silicon', mass: 28.086, category: 'nonmetal'},
            {number: 15, symbol: 'P', name: 'Phosphorus', mass: 30.974, category: 'nonmetal'},
            {number: 16, symbol: 'S', name: 'Sulfur', mass: 32.065, category: 'nonmetal'},
            {number: 17, symbol: 'Cl', name: 'Chlorine', mass: 35.453, category: 'halogen'},
            {number: 18, symbol: 'Ar', name: 'Argon', mass: 39.948, category: 'noble'},
            {number: 26, symbol: 'Fe', name: 'Iron', mass: 55.845, category: 'transition'},
            {number: 29, symbol: 'Cu', name: 'Copper', mass: 63.546, category: 'transition'},
            {number: 47, symbol: 'Ag', name: 'Silver', mass: 107.868, category: 'transition'},
            {number: 79, symbol: 'Au', name: 'Gold', mass: 196.967, category: 'transition'},
            {number: 92, symbol: 'U', name: 'Uranium', mass: 238.029, category: 'metal'}
        ];

        function displayElements() {
            const table = document.getElementById('periodicTable');
            table.innerHTML = '';

            elements.forEach(el => {
                const div = document.createElement('div');
                div.className = `element ${el.category}`;
                div.innerHTML = `
                    <div class="element-number">${el.number}</div>
                    <div class="element-symbol">${el.symbol}</div>
                    <div class="element-name">${el.name}</div>
                    <div class="element-mass">${el.mass}</div>
                `;
                div.onclick = () => showElementInfo(el);
                table.appendChild(div);
            });
        }

        function filterElements() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = elements.filter(el => 
                el.name.toLowerCase().includes(query) ||
                el.symbol.toLowerCase().includes(query) ||
                el.number.toString().includes(query)
            );

            const table = document.getElementById('periodicTable');
            table.innerHTML = '';

            filtered.forEach(el => {
                const div = document.createElement('div');
                div.className = `element ${el.category}`;
                div.innerHTML = `
                    <div class="element-number">${el.number}</div>
                    <div class="element-symbol">${el.symbol}</div>
                    <div class="element-name">${el.name}</div>
                    <div class="element-mass">${el.mass}</div>
                `;
                div.onclick = () => showElementInfo(el);
                table.appendChild(div);
            });
        }

        function showElementInfo(element) {
            document.getElementById('infoTitle').textContent = `${element.name} (${element.symbol})`;
            document.getElementById('infoGrid').innerHTML = `
                <div class="info-item">
                    <div class="info-label">Atomic Number</div>
                    <div class="info-value">${element.number}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Symbol</div>
                    <div class="info-value">${element.symbol}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Atomic Mass</div>
                    <div class="info-value">${element.mass}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Category</div>
                    <div class="info-value">${element.category}</div>
                </div>
            `;
            document.getElementById('elementInfo').style.display = 'block';
            document.getElementById('elementInfo').scrollIntoView({behavior: 'smooth'});
        }

        displayElements();
    </script>
</body>
</html>
