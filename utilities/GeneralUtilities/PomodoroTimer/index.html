<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .back-button {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 500px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 3rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
            text-align: center;
        }
        h1 { margin-bottom: 2rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .timer-display {
            font-size: 4rem;
            font-weight: bold;
            color: #ff6b9d;
            margin: 2rem 0;
            font-family: 'Courier New', monospace;
        }
        .session-label {
            font-size: 1.2rem;
            color: #d4a5af;
            margin-bottom: 1rem;
        }
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
        }
        button {
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
        }
        button:hover { transform: translateY(-2px); }
        button.secondary {
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
        }
        .settings {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid rgba(200, 100, 150, 0.3);
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .setting-group label {
            font-size: 0.9rem;
            color: #d4a5af;
            margin-bottom: 0.5rem;
        }
        .setting-group input {
            width: 60px;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 5px;
            color: #f5e6e8;
            text-align: center;
        }
        .progress-ring {
            width: 300px;
            height: 300px;
            margin: 0 auto;
            position: relative;
        }
        svg { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>🍅 Pomodoro Timer</h1>
        
        <div class="session-label" id="sessionLabel">Work Session</div>
        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="controls">
            <button onclick="startTimer()">Start</button>
            <button class="secondary" onclick="pauseTimer()">Pause</button>
            <button class="secondary" onclick="resetTimer()">Reset</button>
        </div>

        <div class="settings">
            <div class="setting-group">
                <label>Work (min)</label>
                <input type="number" id="workDuration" value="25" min="1" max="60" onchange="resetTimer()">
            </div>
            <div class="setting-group">
                <label>Break (min)</label>
                <input type="number" id="breakDuration" value="5" min="1" max="30" onchange="resetTimer()">
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let isRunning = false;
        let isWorkSession = true;
        let intervalId = null;

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timerDisplay').textContent = 
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            intervalId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft === 0) {
                    clearInterval(intervalId);
                    isRunning = false;
                    switchSession();
                    alert(isWorkSession ? 'Break time over! Back to work!' : 'Work session complete! Take a break.');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(intervalId);
            isRunning = false;
        }

        function resetTimer() {
            clearInterval(intervalId);
            isRunning = false;
            isWorkSession = true;
            const workDuration = parseInt(document.getElementById('workDuration').value);
            timeLeft = workDuration * 60;
            document.getElementById('sessionLabel').textContent = 'Work Session';
            updateDisplay();
        }

        function switchSession() {
            isWorkSession = !isWorkSession;
            const workDuration = parseInt(document.getElementById('workDuration').value);
            const breakDuration = parseInt(document.getElementById('breakDuration').value);
            timeLeft = (isWorkSession ? workDuration : breakDuration) * 60;
            document.getElementById('sessionLabel').textContent = isWorkSession ? 'Work Session' : 'Break Time';
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
