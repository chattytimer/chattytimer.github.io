<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }
        h1 { text-align: center; margin-bottom: 2rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .input-section {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }
        input {
            flex: 1;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
        }
        input:focus { outline: none; border-color: rgba(200, 100, 150, 0.8); }
        button {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .habit-card {
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(200, 100, 150, 0.3);
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .habit-name { font-size: 1.1rem; font-weight: bold; color: #ff6b9d; margin-bottom: 0.5rem; }
        .habit-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .streak { font-size: 1.3rem; color: #6bcf7f; font-weight: bold; }
        .streak-label { color: #d4a5af; font-size: 0.9rem; }
        .habit-buttons {
            display: flex;
            gap: 0.5rem;
        }
        .check-btn {
            flex: 1;
            padding: 0.6rem;
            background: rgba(107, 207, 127, 0.3);
            color: #6bcf7f;
            border: 1px solid rgba(107, 207, 127, 0.5);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        .check-btn:hover { background: rgba(107, 207, 127, 0.5); }
        .delete-btn {
            padding: 0.6rem 1rem;
            background: rgba(220, 50, 80, 0.4);
            font-size: 0.9rem;
        }
        .empty-msg { text-align: center; color: #d4a5af; padding: 2rem; }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>🎯 Habit Tracker</h1>
        
        <div class="input-section">
            <input type="text" id="habitInput" placeholder="New habit (e.g., Exercise, Read, Meditate)" onkeypress="if(event.key==='Enter') addHabit()">
            <button onclick="addHabit()">Add</button>
        </div>

        <div id="habitList"></div>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [];

        function addHabit() {
            const input = document.getElementById('habitInput');
            if (!input.value.trim()) return;
            
            habits.push({
                id: Date.now(),
                name: input.value,
                streak: 0,
                lastChecked: null,
                completedDates: []
            });
            input.value = '';
            saveAndRender();
        }

        function checkHabit(id) {
            const habit = habits.find(h => h.id === id);
            const today = new Date().toDateString();
            
            if (!habit.completedDates.includes(today)) {
                habit.completedDates.push(today);
                habit.lastChecked = today;
                habit.streak = calculateStreak(habit);
            }
            
            saveAndRender();
        }

        function calculateStreak(habit) {
            if (!habit.completedDates || habit.completedDates.length === 0) return 0;
            
            const sorted = habit.completedDates.map(d => new Date(d)).sort((a, b) => b - a);
            let streak = 1;
            
            for (let i = 0; i < sorted.length - 1; i++) {
                const diff = (sorted[i] - sorted[i + 1]) / (1000 * 60 * 60 * 24);
                if (diff === 1) streak++;
                else break;
            }
            
            return streak;
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('habits', JSON.stringify(habits));
            const list = document.getElementById('habitList');
            
            if (habits.length === 0) {
                list.innerHTML = '<div class="empty-msg">No habits yet. Create one to get started!</div>';
                return;
            }
            
            const today = new Date().toDateString();
            list.innerHTML = habits.map(h => {
                const completed = h.completedDates.includes(today);
                return `
                <div class="habit-card">
                    <div class="habit-name">${h.name}</div>
                    <div class="habit-stats">
                        <div>
                            <div class="streak">${h.streak}</div>
                            <div class="streak-label">day streak</div>
                        </div>
                        <div style="color: #d4a5af; font-size: 0.9rem;">
                            Completed: ${h.completedDates.length} days
                        </div>
                    </div>
                    <div class="habit-buttons">
                        <button class="check-btn" onclick="checkHabit(${h.id})" ${completed ? 'disabled' : ''}>
                            ${completed ? '✓ Today Complete' : '✓ Complete Today'}
                        </button>
                        <button class="delete-btn" onclick="deleteHabit(${h.id})">Delete</button>
                    </div>
                </div>
                `;
            }).join('');
        }

        saveAndRender();
    </script>
</body>
</html>
