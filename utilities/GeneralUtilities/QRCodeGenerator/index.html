<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }
        h1 { text-align: center; margin-bottom: 1rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .input-section { margin-bottom: 2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #d4a5af; font-weight: 500; }
        input, textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
            margin-bottom: 1rem;
        }
        input:focus, textarea:focus { outline: none; border-color: rgba(200, 100, 150, 0.8); }
        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        button:hover { transform: translateY(-2px); }
        #qrcode {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(200, 100, 150, 0.3);
            border-radius: 10px;
            display: none;
        }
        #qrcode canvas { margin: 0 auto; display: block; }
        .download-btn {
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            display: none;
        }
        .download-btn:hover { background: rgba(200, 100, 150, 0.5); }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>📱 QR Code Generator</h1>
        
        <div class="input-section">
            <label>Enter Text or URL</label>
            <textarea id="qrInput" placeholder="Type text, URL, or any information you want to encode..." style="height: 120px;"></textarea>
        </div>

        <button onclick="generateQR()">Generate QR Code</button>
        <button class="download-btn" id="downloadBtn" onclick="downloadQR()">📥 Download QR Code</button>

        <div id="qrcode"></div>
    </div>

    <script>
        let qr = null;

        function generateQR() {
            const input = document.getElementById('qrInput').value;
            if (!input) {
                alert('Please enter some text or URL');
                return;
            }

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrContainer.style.display = 'block';

            qr = new QRCode(document.getElementById('qrcode'), {
                text: input,
                width: 300,
                height: 300,
                colorDark: '#ff6b9d',
                colorLight: '#f5e6e8',
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('downloadBtn').style.display = 'block';
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'qrcode.png';
                link.click();
            }
        }

        document.getElementById('qrInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) generateQR();
        });
    </script>
</body>
</html>
