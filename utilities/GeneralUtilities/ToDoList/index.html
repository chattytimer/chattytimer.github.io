<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }
        h1 { text-align: center; margin-bottom: 2rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .input-section {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }
        input {
            flex: 1;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
        }
        input:focus { outline: none; border-color: rgba(200, 100, 150, 0.8); }
        button {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { transform: translateY(-2px); }
        .todo-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .todo-item {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(200, 100, 150, 0.2);
            border-radius: 8px;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .todo-item.completed { opacity: 0.6; }
        .todo-item.completed .todo-text { text-decoration: line-through; color: #999; }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .todo-text { flex: 1; }
        .delete-btn {
            padding: 0.5rem 1rem;
            background: rgba(220, 50, 80, 0.4);
            font-size: 0.9rem;
        }
        .empty-msg { text-align: center; color: #d4a5af; padding: 2rem; }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>✓ To-Do List</h1>
        
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Add a new task..." onkeypress="if(event.key==='Enter') addTodo()">
            <button onclick="addTodo()">Add</button>
        </div>

        <div class="todo-list" id="todoList"></div>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        function addTodo() {
            const input = document.getElementById('todoInput');
            if (!input.value.trim()) return;
            
            todos.push({ id: Date.now(), text: input.value, completed: false });
            input.value = '';
            saveTodos();
            render();
        }

        function toggleTodo(id) {
            todos = todos.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            saveTodos();
            render();
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            render();
        }

        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function render() {
            const list = document.getElementById('todoList');
            if (todos.length === 0) {
                list.innerHTML = '<div class="empty-msg">No tasks yet. Add one to get started!</div>';
                return;
            }
            list.innerHTML = todos.map(t => `
                <div class="todo-item ${t.completed ? 'completed' : ''}">
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTodo(${t.id})">
                    <span class="todo-text">${t.text}</span>
                    <button class="delete-btn" onclick="deleteTodo(${t.id})">Delete</button>
                </div>
            `).join('');
        }

        render();
    </script>
</body>
</html>
