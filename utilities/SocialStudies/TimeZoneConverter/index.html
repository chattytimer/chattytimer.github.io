<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Zone Converter - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }
        h1 { text-align: center; margin-bottom: 2rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .converter-section { margin-bottom: 2rem; padding: 1.5rem; background: rgba(0, 0, 0, 0.2); border-radius: 15px; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #d4a5af; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
        }
        input:focus, select:focus { outline: none; border-color: rgba(200, 100, 150, 0.8); }
        .result-box {
            padding: 1.5rem;
            background: rgba(200, 100, 150, 0.1);
            border: 2px solid rgba(200, 100, 150, 0.4);
            border-radius: 10px;
            text-align: center;
            margin-top: 1.5rem;
        }
        .result-label { color: #d4a5af; font-size: 0.95rem; margin-bottom: 0.5rem; }
        .result-value { font-size: 2rem; font-weight: bold; color: #ff6b9d; }
        .timezone-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .timezone-card {
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(200, 100, 150, 0.2);
        }
        .tz-name { color: #ff6b9d; font-weight: bold; }
        .tz-time { font-size: 1.3rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>🌍 Time Zone Converter</h1>
        <div class="converter-section">
            <div class="form-group">
                <label>Enter Time (24-hour format: HH:MM)</label>
                <input type="time" id="timeInput" value="12:00" onchange="convertTime()">
            </div>
            <div class="form-group">
                <label>From Timezone</label>
                <select id="fromTZ" onchange="convertTime()">
                    <option value="0">UTC/GMT</option>
                    <option value="-5">EST (UTC-5)</option>
                    <option value="-6">CST (UTC-6)</option>
                    <option value="-7">MST (UTC-7)</option>
                    <option value="-8">PST (UTC-8)</option>
                    <option value="1">CET (UTC+1)</option>
                    <option value="8">HKT (UTC+8)</option>
                    <option value="9">JST (UTC+9)</option>
                </select>
            </div>
            <div class="timezone-grid" id="timezoneResults"></div>
        </div>
    </div>
    <script>
        const timezones = [
            {name: 'UTC', offset: 0},
            {name: 'EST', offset: -5},
            {name: 'CST', offset: -6},
            {name: 'PST', offset: -8},
            {name: 'GMT', offset: 0},
            {name: 'CET', offset: 1},
            {name: 'IST', offset: 5.5},
            {name: 'JST', offset: 9}
        ];

        function convertTime() {
            const time = document.getElementById('timeInput').value;
            const fromTZ = parseInt(document.getElementById('fromTZ').value);
            const [hours, minutes] = time.split(':').map(Number);

            const resultsDiv = document.getElementById('timezoneResults');
            resultsDiv.innerHTML = timezones.map(tz => {
                const diff = tz.offset - fromTZ;
                let newHours = (hours + diff + 24) % 24;
                const timeStr = String(newHours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
                return `<div class="timezone-card"><div class="tz-name">${tz.name} (UTC${tz.offset > 0 ? '+' : ''}${tz.offset})</div><div class="tz-time">${timeStr}</div></div>`;
            }).join('');
        }

        convertTime();
    </script>
</body>
</html>
