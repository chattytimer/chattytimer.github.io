<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citation Generator - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }
        h1 { text-align: center; margin-bottom: 1rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .format-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 0.8rem 1.5rem;
            background: rgba(200, 100, 150, 0.2);
            border: 2px solid rgba(200, 100, 150, 0.3);
            color: #f5e6e8;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active {
            background: rgba(200, 100, 150, 0.5);
            border-color: rgba(200, 100, 150, 0.8);
        }
        .form-section { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #d4a5af; font-weight: 500; font-size: 0.9rem; }
        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(200, 100, 150, 0.8); }
        .btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(200, 100, 150, 0.4); }
        .citation-box {
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(200, 100, 150, 0.4);
            border-radius: 10px;
            margin-top: 1.5rem;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 100px;
            line-height: 1.6;
        }
        .copy-btn { padding: 0.8rem 1.5rem; background: rgba(200, 100, 150, 0.3); color: #ff6b9d; border: none; border-radius: 5px; cursor: pointer; margin-top: 1rem; }
        .hidden { display: none; }
        @media (max-width: 768px) { .form-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>📚 Citation Generator</h1>
        <div class="format-tabs">
            <button class="tab-btn active" onclick="switchFormat('mla')">MLA</button>
            <button class="tab-btn" onclick="switchFormat('apa')">APA</button>
            <button class="tab-btn" onclick="switchFormat('chicago')">Chicago</button>
        </div>

        <!-- MLA Format -->
        <div id="mla-form" class="form-section">
            <div class="form-group">
                <label>Author Last Name</label>
                <input type="text" id="mla-author-last" placeholder="e.g., Smith">
            </div>
            <div class="form-group">
                <label>Author First Name</label>
                <input type="text" id="mla-author-first" placeholder="e.g., John">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Title of Work</label>
                <input type="text" id="mla-title" placeholder="e.g., The Great Gatsby">
            </div>
            <div class="form-group">
                <label>Publisher</label>
                <input type="text" id="mla-publisher">
            </div>
            <div class="form-group">
                <label>Publication Year</label>
                <input type="number" id="mla-year" placeholder="e.g., 2020">
            </div>
            <button class="btn" onclick="generateMLA()">Generate Citation</button>
        </div>

        <!-- APA Format -->
        <div id="apa-form" class="form-section hidden">
            <div class="form-group">
                <label>Author Last Name</label>
                <input type="text" id="apa-author-last">
            </div>
            <div class="form-group">
                <label>Author First Name Initial</label>
                <input type="text" id="apa-author-first" placeholder="e.g., J.">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Title of Work</label>
                <input type="text" id="apa-title">
            </div>
            <div class="form-group">
                <label>Publication Year</label>
                <input type="number" id="apa-year">
            </div>
            <div class="form-group">
                <label>Publisher</label>
                <input type="text" id="apa-publisher">
            </div>
            <button class="btn" onclick="generateAPA()">Generate Citation</button>
        </div>

        <!-- Chicago Format -->
        <div id="chicago-form" class="form-section hidden">
            <div class="form-group">
                <label>Author First Name</label>
                <input type="text" id="chicago-author-first">
            </div>
            <div class="form-group">
                <label>Author Last Name</label>
                <input type="text" id="chicago-author-last">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Title of Work</label>
                <input type="text" id="chicago-title">
            </div>
            <div class="form-group">
                <label>Publisher</label>
                <input type="text" id="chicago-publisher">
            </div>
            <div class="form-group">
                <label>Publication Year</label>
                <input type="number" id="chicago-year">
            </div>
            <button class="btn" onclick="generateChicago()">Generate Citation</button>
        </div>

        <div class="citation-box" id="citationOutput" style="display: none;"></div>
        <button class="copy-btn" id="copyBtn" onclick="copyCitation()" style="display: none;">📋 Copy to Clipboard</button>
    </div>

    <script>
        function switchFormat(format) {
            document.querySelectorAll('[id$="-form"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(format + '-form').classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function generateMLA() {
            const last = document.getElementById('mla-author-last').value;
            const first = document.getElementById('mla-author-first').value;
            const title = document.getElementById('mla-title').value;
            const publisher = document.getElementById('mla-publisher').value;
            const year = document.getElementById('mla-year').value;
            const citation = `${last}, ${first}. "${title}." ${publisher}, ${year}.`;
            showCitation(citation);
        }

        function generateAPA() {
            const last = document.getElementById('apa-author-last').value;
            const first = document.getElementById('apa-author-first').value;
            const title = document.getElementById('apa-title').value;
            const year = document.getElementById('apa-year').value;
            const pub = document.getElementById('apa-publisher').value;
            const citation = `${last}, ${first} (${year}). ${title}. ${pub}.`;
            showCitation(citation);
        }

        function generateChicago() {
            const first = document.getElementById('chicago-author-first').value;
            const last = document.getElementById('chicago-author-last').value;
            const title = document.getElementById('chicago-title').value;
            const publisher = document.getElementById('chicago-publisher').value;
            const year = document.getElementById('chicago-year').value;
            const citation = `${first} ${last}. "${title}." ${publisher}, ${year}.`;
            showCitation(citation);
        }

        function showCitation(text) {
            const output = document.getElementById('citationOutput');
            output.textContent = text;
            output.style.display = 'block';
            document.getElementById('copyBtn').style.display = 'block';
        }

        function copyCitation() {
            const text = document.getElementById('citationOutput').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Citation copied to clipboard!');
            });
        }
    </script>
</body>
</html>
