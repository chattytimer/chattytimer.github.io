<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essay Outline Generator - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }
        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }
        h1 { text-align: center; margin-bottom: 1rem; background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { text-align: center; color: #d4a5af; margin-bottom: 2rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        label { display: block; margin-bottom: 0.5rem; color: #d4a5af; font-weight: 500; }
        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(200, 100, 150, 0.8); }
        .btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        .outline-box {
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(200, 100, 150, 0.4);
            border-radius: 10px;
            margin-top: 2rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.8;
            font-family: 'Courier New', monospace;
            display: none;
        }
        .hidden { display: none; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    <div class="container">
        <h1>✍️ Essay Outline Generator</h1>
        <p class="subtitle">Create a structured outline for your essay</p>
        
        <div class="form-grid">
            <div>
                <label>Essay Topic/Prompt</label>
                <textarea id="topic" placeholder="Enter your essay topic..." style="height: 80px;"></textarea>
            </div>
            <div>
                <label>Main Argument (Thesis)</label>
                <textarea id="thesis" placeholder="What is your main argument?" style="height: 80px;"></textarea>
            </div>
        </div>

        <div class="form-grid">
            <div>
                <label>Main Point 1</label>
                <input type="text" id="point1" placeholder="First main point">
            </div>
            <div>
                <label>Supporting Detail 1A</label>
                <input type="text" id="point1a" placeholder="Supporting detail">
            </div>
        </div>

        <div class="form-grid">
            <div>
                <label>Main Point 2</label>
                <input type="text" id="point2" placeholder="Second main point">
            </div>
            <div>
                <label>Supporting Detail 2A</label>
                <input type="text" id="point2a" placeholder="Supporting detail">
            </div>
        </div>

        <div class="form-grid">
            <div>
                <label>Main Point 3</label>
                <input type="text" id="point3" placeholder="Third main point">
            </div>
            <div>
                <label>Supporting Detail 3A</label>
                <input type="text" id="point3a" placeholder="Supporting detail">
            </div>
        </div>

        <div>
            <label>Conclusion Summary</label>
            <textarea id="conclusion" placeholder="Sum up your main points..." style="width: 100%; height: 80px; padding: 0.8rem; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(200, 100, 150, 0.4); border-radius: 8px; color: #f5e6e8; margin-bottom: 1.5rem;"></textarea>
        </div>

        <button class="btn" onclick="generateOutline()">Generate Outline</button>

        <div class="outline-box" id="outlineOutput"></div>
    </div>

    <script>
        function generateOutline() {
            const topic = document.getElementById('topic').value;
            const thesis = document.getElementById('thesis').value;
            const point1 = document.getElementById('point1').value;
            const point1a = document.getElementById('point1a').value;
            const point2 = document.getElementById('point2').value;
            const point2a = document.getElementById('point2a').value;
            const point3 = document.getElementById('point3').value;
            const point3a = document.getElementById('point3a').value;
            const conclusion = document.getElementById('conclusion').value;

            const outline = `ESSAY OUTLINE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

TOPIC: ${topic || 'N/A'}

I. INTRODUCTION
   A. Hook/Attention Grabber
   B. Background Information
   C. Thesis Statement
      ${thesis || 'N/A'}

II. BODY - POINT 1
   A. ${point1 || 'Main Point 1'}
      1. ${point1a || 'Supporting Detail'}
      2. Example or Evidence
   B. Counterargument (Optional)

III. BODY - POINT 2
   A. ${point2 || 'Main Point 2'}
      1. ${point2a || 'Supporting Detail'}
      2. Example or Evidence
   B. Transition to Next Point

IV. BODY - POINT 3
   A. ${point3 || 'Main Point 3'}
      1. ${point3a || 'Supporting Detail'}
      2. Example or Evidence
   B. Connection to Thesis

V. CONCLUSION
   A. Restate Thesis
   B. Summary of Main Points
   C. ${conclusion || 'Final Thoughts/Call to Action'}`;

            document.getElementById('outlineOutput').textContent = outline;
            document.getElementById('outlineOutput').style.display = 'block';
        }
    </script>
</body>
</html>
