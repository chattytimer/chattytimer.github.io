<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(200, 100, 150, 0.5);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #d4a5af;
            margin-bottom: 2rem;
        }

        .calculator-section {
            margin-bottom: 2.5rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(200, 100, 150, 0.2);
        }

        .section-title {
            font-size: 1.3rem;
            color: #ff6b9d;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid rgba(200, 100, 150, 0.3);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #d4a5af;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(200, 100, 150, 0.8);
            background: rgba(0, 0, 0, 0.4);
        }

        .grade-input-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: end;
        }

        .grade-input-row input {
            width: 100%;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 100, 150, 0.4);
        }

        .btn-small {
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
        }

        .btn-danger {
            background: rgba(220, 50, 80, 0.6);
        }

        .btn-danger:hover {
            background: rgba(220, 50, 80, 0.8);
        }

        .result-box {
            padding: 1.5rem;
            background: rgba(200, 100, 150, 0.1);
            border: 2px solid rgba(200, 100, 150, 0.4);
            border-radius: 10px;
            text-align: center;
            margin-top: 1.5rem;
        }

        .result-label {
            color: #d4a5af;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff6b9d;
        }

        .grade-display {
            margin-top: 0.8rem;
            font-size: 1.2rem;
            color: #c44569;
        }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    
    <div class="container">
        <h1>Grade Calculator</h1>
        <p class="subtitle">Calculate your grades and GPA easily</p>

        <!-- Weighted Grade Calculator -->
        <div class="calculator-section">
            <div class="section-title">Weighted Grade Calculator</div>
            
            <div class="form-group">
                <label>Assignment/Test Name</label>
                <div class="grade-input-row">
                    <input type="text" id="gradeName" placeholder="e.g., Midterm Exam">
                    <input type="number" id="gradeScore" placeholder="Score" min="0" max="100" step="0.01">
                    <input type="number" id="gradeWeight" placeholder="Weight %" min="0" max="100" step="0.1">
                    <button class="btn btn-small" onclick="addGrade()">Add</button>
                </div>
            </div>

            <div id="gradesContainer"></div>

            <div class="result-box">
                <div class="result-label">Current Weighted Grade</div>
                <div class="result-value" id="weightedGrade">--</div>
                <div class="grade-display" id="letterGrade"></div>
            </div>
        </div>

        <!-- Letter Grade Converter -->
        <div class="calculator-section">
            <div class="section-title">Letter Grade Converter</div>
            
            <div class="form-group">
                <label>Percentage Score</label>
                <input type="number" id="percentScore" placeholder="Enter percentage (0-100)" min="0" max="100" step="0.01" oninput="convertGrade()">
            </div>

            <div class="result-box">
                <div class="result-label">Letter Grade</div>
                <div class="result-value" id="letterGradeResult">--</div>
            </div>
        </div>

        <!-- GPA Calculator -->
        <div class="calculator-section">
            <div class="section-title">GPA Calculator</div>
            
            <div class="form-group">
                <label>Course Name</label>
                <div class="grade-input-row">
                    <input type="text" id="courseName" placeholder="e.g., AP Calculus">
                    <select id="courseGrade">
                        <option value="">Select Grade</option>
                        <option value="4.0">A (4.0)</option>
                        <option value="3.7">A- (3.7)</option>
                        <option value="3.3">B+ (3.3)</option>
                        <option value="3.0">B (3.0)</option>
                        <option value="2.7">B- (2.7)</option>
                        <option value="2.3">C+ (2.3)</option>
                        <option value="2.0">C (2.0)</option>
                        <option value="1.7">C- (1.7)</option>
                        <option value="1.3">D+ (1.3)</option>
                        <option value="1.0">D (1.0)</option>
                        <option value="0.0">F (0.0)</option>
                    </select>
                    <button class="btn btn-small" onclick="addCourse()">Add</button>
                </div>
            </div>

            <div id="coursesContainer"></div>

            <div class="result-box">
                <div class="result-label">Cumulative GPA</div>
                <div class="result-value" id="gpaResult">--</div>
            </div>
        </div>
    </div>

    <script>
        let grades = [];
        let courses = [];

        function addGrade() {
            const name = document.getElementById('gradeName').value.trim();
            const score = parseFloat(document.getElementById('gradeScore').value);
            const weight = parseFloat(document.getElementById('gradeWeight').value);

            if (!name || isNaN(score) || isNaN(weight)) {
                alert('Please fill in all fields');
                return;
            }

            grades.push({ name, score, weight });
            document.getElementById('gradeName').value = '';
            document.getElementById('gradeScore').value = '';
            document.getElementById('gradeWeight').value = '';

            displayGrades();
            calculateWeightedGrade();
        }

        function displayGrades() {
            const container = document.getElementById('gradesContainer');
            container.innerHTML = '<div style="margin-bottom: 1rem;"><strong>Added Grades:</strong></div>';
            
            grades.forEach((g, i) => {
                const div = document.createElement('div');
                div.className = 'grade-input-row';
                div.style.marginBottom = '0.8rem';
                div.innerHTML = `
                    <span>${g.name}: ${g.score}% (${g.weight}%)</span>
                    <button class="btn btn-small btn-danger" onclick="removeGrade(${i})">Remove</button>
                `;
                container.appendChild(div);
            });
        }

        function removeGrade(index) {
            grades.splice(index, 1);
            displayGrades();
            calculateWeightedGrade();
        }

        function calculateWeightedGrade() {
            if (grades.length === 0) {
                document.getElementById('weightedGrade').textContent = '--';
                document.getElementById('letterGrade').textContent = '';
                return;
            }

            const totalWeight = grades.reduce((sum, g) => sum + g.weight, 0);
            if (totalWeight === 0) {
                document.getElementById('weightedGrade').textContent = '--';
                return;
            }

            const weightedSum = grades.reduce((sum, g) => sum + (g.score * g.weight), 0);
            const weighted = weightedSum / totalWeight;
            const rounded = weighted.toFixed(2);

            document.getElementById('weightedGrade').textContent = rounded + '%';
            document.getElementById('letterGrade').textContent = `Grade: ${getLetterGrade(rounded)}`;
        }

        function convertGrade() {
            const percent = parseFloat(document.getElementById('percentScore').value);
            if (isNaN(percent)) {
                document.getElementById('letterGradeResult').textContent = '--';
                return;
            }
            document.getElementById('letterGradeResult').textContent = getLetterGrade(percent);
        }

        function getLetterGrade(percent) {
            if (percent >= 97) return 'A+ (97-100)';
            if (percent >= 93) return 'A (93-96)';
            if (percent >= 90) return 'A- (90-92)';
            if (percent >= 87) return 'B+ (87-89)';
            if (percent >= 83) return 'B (83-86)';
            if (percent >= 80) return 'B- (80-82)';
            if (percent >= 77) return 'C+ (77-79)';
            if (percent >= 73) return 'C (73-76)';
            if (percent >= 70) return 'C- (70-72)';
            if (percent >= 67) return 'D+ (67-69)';
            if (percent >= 63) return 'D (63-66)';
            if (percent >= 60) return 'D- (60-62)';
            return 'F (Below 60)';
        }

        function addCourse() {
            const name = document.getElementById('courseName').value.trim();
            const grade = document.getElementById('courseGrade').value;

            if (!name || !grade) {
                alert('Please fill in all fields');
                return;
            }

            courses.push({ name, grade: parseFloat(grade) });
            document.getElementById('courseName').value = '';
            document.getElementById('courseGrade').value = '';

            displayCourses();
            calculateGPA();
        }

        function displayCourses() {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '<div style="margin-bottom: 1rem;"><strong>Your Courses:</strong></div>';
            
            courses.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = 'grade-input-row';
                div.style.marginBottom = '0.8rem';
                div.innerHTML = `
                    <span>${c.name}: ${c.grade.toFixed(1)}</span>
                    <button class="btn btn-small btn-danger" onclick="removeCourse(${i})">Remove</button>
                `;
                container.appendChild(div);
            });
        }

        function removeCourse(index) {
            courses.splice(index, 1);
            displayCourses();
            calculateGPA();
        }

        function calculateGPA() {
            if (courses.length === 0) {
                document.getElementById('gpaResult').textContent = '--';
                return;
            }

            const sum = courses.reduce((total, c) => total + c.grade, 0);
            const gpa = (sum / courses.length).toFixed(2);
            document.getElementById('gpaResult').textContent = gpa;
        }
    </script>
</body>
</html>
