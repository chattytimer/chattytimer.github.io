<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - Chatty Utility</title>
    <link rel="icon" type="image/png" href="../../../Images/Logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a0f 0%, #4a0e1f 100%);
            color: #f5e6e8;
            padding: 2rem;
            min-height: 100vh;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 1rem;
            padding: 0.7rem 1.5rem;
            background: rgba(200, 100, 150, 0.3);
            color: #ff6b9d;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(200, 100, 150, 0.5);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(200, 100, 150, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #d4a5af;
            margin-bottom: 2rem;
        }

        .converter-section {
            margin-bottom: 2.5rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(200, 100, 150, 0.2);
        }

        .section-title {
            font-size: 1.3rem;
            color: #ff6b9d;
            margin-bottom: 1.5rem;
        }

        .converter-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem;
            align-items: end;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 0.5rem;
            color: #d4a5af;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input, select {
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.4);
            border-radius: 8px;
            color: #f5e6e8;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: rgba(200, 100, 150, 0.8);
            background: rgba(0, 0, 0, 0.4);
        }

        .arrow {
            text-align: center;
            color: #ff6b9d;
            font-size: 1.5rem;
            margin-top: 1.8rem;
        }

        .result-box {
            padding: 1.5rem;
            background: rgba(200, 100, 150, 0.1);
            border: 2px solid rgba(200, 100, 150, 0.4);
            border-radius: 10px;
            text-align: center;
            margin-top: 1rem;
        }

        .result-label {
            color: #d4a5af;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .result-value {
            font-size: 2rem;
            font-weight: bold;
            color: #ff6b9d;
        }
    </style>
</head>
<body>
    <a href="../../../index.html" class="back-button">← Back to Home</a>
    
    <div class="container">
        <h1>Unit Converter</h1>
        <p class="subtitle">Convert between different units of measurement</p>

        <!-- Length Converter -->
        <div class="converter-section">
            <div class="section-title">📏 Length Converter</div>
            <div class="converter-row">
                <div class="form-group">
                    <label>From</label>
                    <select id="lengthFromUnit" onchange="convertLength()">
                        <option value="meter">Meter (m)</option>
                        <option value="kilometer">Kilometer (km)</option>
                        <option value="centimeter">Centimeter (cm)</option>
                        <option value="millimeter">Millimeter (mm)</option>
                        <option value="mile">Mile (mi)</option>
                        <option value="yard">Yard (yd)</option>
                        <option value="foot">Foot (ft)</option>
                        <option value="inch">Inch (in)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Value</label>
                    <input type="number" id="lengthValue" placeholder="Enter value" oninput="convertLength()">
                </div>
                <div class="form-group">
                    <label>To</label>
                    <select id="lengthToUnit" onchange="convertLength()">
                        <option value="meter">Meter (m)</option>
                        <option value="kilometer">Kilometer (km)</option>
                        <option value="centimeter">Centimeter (cm)</option>
                        <option value="millimeter">Millimeter (mm)</option>
                        <option value="mile">Mile (mi)</option>
                        <option value="yard">Yard (yd)</option>
                        <option value="foot">Foot (ft)</option>
                        <option value="inch">Inch (in)</option>
                    </select>
                </div>
            </div>
            <div class="result-box" id="lengthResult" style="display: none;">
                <div class="result-label">Result</div>
                <div class="result-value" id="lengthOutput">--</div>
            </div>
        </div>

        <!-- Weight Converter -->
        <div class="converter-section">
            <div class="section-title">⚖️ Weight Converter</div>
            <div class="converter-row">
                <div class="form-group">
                    <label>From</label>
                    <select id="weightFromUnit" onchange="convertWeight()">
                        <option value="kilogram">Kilogram (kg)</option>
                        <option value="gram">Gram (g)</option>
                        <option value="milligram">Milligram (mg)</option>
                        <option value="pound">Pound (lb)</option>
                        <option value="ounce">Ounce (oz)</option>
                        <option value="ton">Ton (metric)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Value</label>
                    <input type="number" id="weightValue" placeholder="Enter value" oninput="convertWeight()">
                </div>
                <div class="form-group">
                    <label>To</label>
                    <select id="weightToUnit" onchange="convertWeight()">
                        <option value="kilogram">Kilogram (kg)</option>
                        <option value="gram">Gram (g)</option>
                        <option value="milligram">Milligram (mg)</option>
                        <option value="pound">Pound (lb)</option>
                        <option value="ounce">Ounce (oz)</option>
                        <option value="ton">Ton (metric)</option>
                    </select>
                </div>
            </div>
            <div class="result-box" id="weightResult" style="display: none;">
                <div class="result-label">Result</div>
                <div class="result-value" id="weightOutput">--</div>
            </div>
        </div>

        <!-- Temperature Converter -->
        <div class="converter-section">
            <div class="section-title">🌡️ Temperature Converter</div>
            <div class="converter-row">
                <div class="form-group">
                    <label>From</label>
                    <select id="tempFromUnit" onchange="convertTemperature()">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Value</label>
                    <input type="number" id="tempValue" placeholder="Enter value" oninput="convertTemperature()">
                </div>
                <div class="form-group">
                    <label>To</label>
                    <select id="tempToUnit" onchange="convertTemperature()">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>
            </div>
            <div class="result-box" id="tempResult" style="display: none;">
                <div class="result-label">Result</div>
                <div class="result-value" id="tempOutput">--</div>
            </div>
        </div>

        <!-- Volume Converter -->
        <div class="converter-section">
            <div class="section-title">🧃 Volume Converter</div>
            <div class="converter-row">
                <div class="form-group">
                    <label>From</label>
                    <select id="volumeFromUnit" onchange="convertVolume()">
                        <option value="liter">Liter (L)</option>
                        <option value="milliliter">Milliliter (mL)</option>
                        <option value="gallon">Gallon (gal)</option>
                        <option value="quart">Quart (qt)</option>
                        <option value="pint">Pint (pt)</option>
                        <option value="cup">Cup (cup)</option>
                        <option value="fluidounce">Fluid Ounce (fl oz)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Value</label>
                    <input type="number" id="volumeValue" placeholder="Enter value" oninput="convertVolume()">
                </div>
                <div class="form-group">
                    <label>To</label>
                    <select id="volumeToUnit" onchange="convertVolume()">
                        <option value="liter">Liter (L)</option>
                        <option value="milliliter">Milliliter (mL)</option>
                        <option value="gallon">Gallon (gal)</option>
                        <option value="quart">Quart (qt)</option>
                        <option value="pint">Pint (pt)</option>
                        <option value="cup">Cup (cup)</option>
                        <option value="fluidounce">Fluid Ounce (fl oz)</option>
                    </select>
                </div>
            </div>
            <div class="result-box" id="volumeResult" style="display: none;">
                <div class="result-label">Result</div>
                <div class="result-value" id="volumeOutput">--</div>
            </div>
        </div>
    </div>

    <script>
        // Length conversions (all to meters)
        const lengthToMeters = {
            meter: 1,
            kilometer: 1000,
            centimeter: 0.01,
            millimeter: 0.001,
            mile: 1609.34,
            yard: 0.9144,
            foot: 0.3048,
            inch: 0.0254
        };

        function convertLength() {
            const value = parseFloat(document.getElementById('lengthValue').value);
            if (isNaN(value) || value < 0) {
                document.getElementById('lengthResult').style.display = 'none';
                return;
            }

            const fromUnit = document.getElementById('lengthFromUnit').value;
            const toUnit = document.getElementById('lengthToUnit').value;

            const meters = value * lengthToMeters[fromUnit];
            const result = meters / lengthToMeters[toUnit];

            document.getElementById('lengthOutput').textContent = result.toFixed(6);
            document.getElementById('lengthResult').style.display = 'block';
        }

        // Weight conversions (all to grams)
        const weightToGrams = {
            kilogram: 1000,
            gram: 1,
            milligram: 0.001,
            pound: 453.592,
            ounce: 28.3495,
            ton: 1000000
        };

        function convertWeight() {
            const value = parseFloat(document.getElementById('weightValue').value);
            if (isNaN(value) || value < 0) {
                document.getElementById('weightResult').style.display = 'none';
                return;
            }

            const fromUnit = document.getElementById('weightFromUnit').value;
            const toUnit = document.getElementById('weightToUnit').value;

            const grams = value * weightToGrams[fromUnit];
            const result = grams / weightToGrams[toUnit];

            document.getElementById('weightOutput').textContent = result.toFixed(6);
            document.getElementById('weightResult').style.display = 'block';
        }

        function convertTemperature() {
            const value = parseFloat(document.getElementById('tempValue').value);
            if (isNaN(value)) {
                document.getElementById('tempResult').style.display = 'none';
                return;
            }

            const fromUnit = document.getElementById('tempFromUnit').value;
            const toUnit = document.getElementById('tempToUnit').value;

            let celsius;
            if (fromUnit === 'celsius') celsius = value;
            else if (fromUnit === 'fahrenheit') celsius = (value - 32) * 5/9;
            else if (fromUnit === 'kelvin') celsius = value - 273.15;

            let result;
            if (toUnit === 'celsius') result = celsius;
            else if (toUnit === 'fahrenheit') result = (celsius * 9/5) + 32;
            else if (toUnit === 'kelvin') result = celsius + 273.15;

            document.getElementById('tempOutput').textContent = result.toFixed(2);
            document.getElementById('tempResult').style.display = 'block';
        }

        // Volume conversions (all to milliliters)
        const volumeToMilliliters = {
            liter: 1000,
            milliliter: 1,
            gallon: 3785.41,
            quart: 946.353,
            pint: 473.176,
            cup: 236.588,
            fluidounce: 29.5735
        };

        function convertVolume() {
            const value = parseFloat(document.getElementById('volumeValue').value);
            if (isNaN(value) || value < 0) {
                document.getElementById('volumeResult').style.display = 'none';
                return;
            }

            const fromUnit = document.getElementById('volumeFromUnit').value;
            const toUnit = document.getElementById('volumeToUnit').value;

            const milliliters = value * volumeToMilliliters[fromUnit];
            const result = milliliters / volumeToMilliliters[toUnit];

            document.getElementById('volumeOutput').textContent = result.toFixed(6);
            document.getElementById('volumeResult').style.display = 'block';
        }
    </script>
</body>
</html>
